name: Style

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  g-style:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgsl-dev libxerces-c-dev xsdcxx

      - uses: astral-sh/setup-uv@v10.2.0

      - name: clang-format and clang-tidy-diff against the merge base
        env:
          BASE_REF: origin/${{ github.base_ref || github.event.repository.default_branch }}
          CC: clang
          CXX: clang++
        run: util/ci-style.sh "$BASE_REF"
