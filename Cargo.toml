[workspace]
resolver = "2"
members = [
    "crates/om-rng",
    "crates/om-core",
    "crates/om-schema",
    "crates/om-pkpd",
    "crates/om-within-host",
    "crates/om-clinical",
    "crates/om-transmission",
    "crates/om-interventions",
    "crates/om-monitoring",
    "crates/om-sim",
    "crates/openmalaria",
    "crates/openmalaria-cli",
    "bindings/openmalaria-py",
]

[workspace.package]
version = "50.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/SwissTPH/openmalaria"

[workspace.dependencies]
om-rng = { path = "crates/om-rng" }
om-core = { path = "crates/om-core" }
om-schema = { path = "crates/om-schema" }
om-pkpd = { path = "crates/om-pkpd" }
om-within-host = { path = "crates/om-within-host" }
om-clinical = { path = "crates/om-clinical" }
om-transmission = { path = "crates/om-transmission" }
om-interventions = { path = "crates/om-interventions" }
om-monitoring = { path = "crates/om-monitoring" }
om-sim = { path = "crates/om-sim" }
openmalaria = { path = "crates/openmalaria" }

roxmltree = "0.20"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
bincode = { version = "2.0", features = ["serde"] }
thiserror = "2.0"
bitflags = { version = "2.8", features = ["serde"] }
flate2 = "1.1"
rayon = "1.10"
proptest = "1.6"
approx = "0.5"

[profile.release]
opt-level = 3

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
