[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "openmalaria"
version = "0.1.0"
description = "Python bindings for the OpenMalaria malaria-transmission simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy>=1.20", "pandas>=1.3"]

[project.optional-dependencies]
mpi = ["mpi4py"]
test = ["pytest"]

[tool.scikit-build]
cmake.source-dir = ".."
cmake.build-type = "Release"
wheel.packages = ["openmalaria"]

[tool.scikit-build.cmake.define]
OM_BUILD_PYTHON = "ON"
OM_CXXTEST_ENABLE = "OFF"
OM_BOXTEST_ENABLE = "OFF"
